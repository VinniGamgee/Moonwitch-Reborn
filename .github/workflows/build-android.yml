name: Moonwitch Android

on:
  workflow_dispatch:
    inputs:
      pgo_mode:
        description: Native PGO mode (GENERATE produces a training APK)
        type: choice
        options: ['OFF', 'GENERATE', 'USE']
        default: 'USE'
      pgo_profile:
        description: Repository-relative merged .profdata path (USE only)
        type: string
        default: ''
  push:
    branches:
      - main
      - 'experiment/ubo-gpu-coherency'
      - 'feature/eden-post-processing'
  pull_request:
    branches:
      - main

concurrency:
  group: moonwitch-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    strategy:
      fail-fast: false
      matrix:
        pgo: ${{ fromJSON(github.event_name == 'pull_request' && '["OFF","GENERATE","USE"]' || format('["{0}"]', inputs.pgo_mode || (github.ref == 'refs/heads/main' && 'USE' || 'OFF'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CCACHE: 'false'
    steps:
      - name: Checkout Moonwitch
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Validate UI resources
        run: python3 .ci/android/check_ui_resources.py

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools spirv-tools
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.31.6"

      - name: Build APK
        shell: bash
        env:
          PGO_MODE: ${{ matrix.pgo }}
          PGO_PROFILE: ${{ inputs.pgo_profile }}
        run: |
          chmod +x .ci/android/build.sh src/android/gradlew
          PGO_ARGS=("-DMOONWITCH_PGO_MODE=$PGO_MODE")
          if [[ "$PGO_MODE" == USE ]]; then
            if [[ -z "$PGO_PROFILE" ]]; then
              xz -dc profiles/android/poco-f5.profdata.xz > "$GITHUB_WORKSPACE/pgo-training.profdata"
              PGO_PROFILE=pgo-training.profdata
            fi
            PROFILE_PATH=$(realpath -e -- "$PGO_PROFILE")
            [[ "$PROFILE_PATH" == "$GITHUB_WORKSPACE/"* && "$PROFILE_PATH" != *" "* ]]
            PGO_ARGS+=("-DMOONWITCH_PGO_PROFILE=$PROFILE_PATH")
          fi
          .ci/android/build.sh -n -t standard -b Release "${PGO_ARGS[@]}"

      - name: Verify native optimization flags
        env:
          PGO_MODE: ${{ matrix.pgo }}
        run: python3 .ci/android/check_performance_build.py "$PGO_MODE"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MOONWITCH-ANDROID-${{ matrix.pgo }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7
