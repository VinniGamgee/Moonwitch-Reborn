name: Moonwitch Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - reformulation
      - 'stability/**'
  pull_request:
    branches:
      - main

concurrency:
  group: moonwitch-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CCACHE: 'false'
    steps:
      - name: Checkout Moonwitch
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Validate UI resources
        run: python3 .ci/android/check_ui_resources.py

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools spirv-tools
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.31.6"

      - name: Build APK
        shell: bash
        run: |
          chmod +x .ci/android/build.sh src/android/gradlew
          .ci/android/build.sh -n -t standard -b Release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MOONWITCH-ANDROID
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7
