name: Moonwitch Reformulation Android

on:
  workflow_dispatch:
  push:
    branches:
      - reformulation

jobs:
  build-reformulation:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PGO: 'true'
      CCACHE: 'false'
    steps:
      - name: Checkout reformulation
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y curl glslang-tools spirv-tools
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.31.6"

      - name: Build experimental APK
        shell: bash
        run: |
          chmod +x .ci/android/build.sh src/android/gradlew
          .ci/android/build.sh -n -t standard -b Release

      - name: Upload experimental APK
        uses: actions/upload-artifact@v4
        with:
          name: MOONWITCH-REFORMULATION
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7
